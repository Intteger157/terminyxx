<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <title>Terminyxx</title>
  <defs>
    <!-- Tile: deep violet, lit from the top left -->
    <linearGradient id="tile" x1="100" y1="100" x2="924" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9B7BFF"/>
      <stop offset="0.45" stop-color="#6D3EF0"/>
      <stop offset="1" stop-color="#2A0A5E"/>
    </linearGradient>
    <radialGradient id="tileSheen" cx="0.22" cy="0.08" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tileRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Windows -->
    <linearGradient id="win" x1="160" y1="250" x2="864" y2="884" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1D1A2C"/>
      <stop offset="1" stop-color="#0A0910"/>
    </linearGradient>
    <linearGradient id="winRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2D4FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0.16"/>
    </linearGradient>

    <!-- Prompt -->
    <linearGradient id="chevron" x1="270" y1="470" x2="440" y2="690" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4DAFF"/>
    </linearGradient>
    <linearGradient id="cursor" x1="490" y1="0" x2="740" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F0E6FF"/>
      <stop offset="0.5" stop-color="#C4A6FF"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>

    <filter id="dropWin" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#14002E" flood-opacity="0.6"/>
    </filter>
    <filter id="neon" x="-40%" y="-200%" width="180%" height="500%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="18" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b2"/>
      <feMerge><feMergeNode in="b1"/><feMergeNode in="b1"/><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="chevGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#B794FF" flood-opacity="0.55"/>
    </filter>

    <clipPath id="tileClip"><rect x="100" y="100" width="824" height="824" rx="190"/></clipPath>
    <clipPath id="frontClip"><rect x="160" y="250" width="704" height="634" rx="124"/></clipPath>
  </defs>

  <!-- Tile -->
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#tile)"/>
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#tileSheen)"/>

  <g clip-path="url(#tileClip)">
    <!-- Back sessions: two stacked windows behind the front one -->
    <rect x="262" y="150" width="500" height="520" rx="96" fill="#1A1430" fill-opacity="0.35" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="4"/>
    <rect x="212" y="196" width="600" height="580" rx="110" fill="#15112A" fill-opacity="0.55" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="4"/>

    <!-- Front window -->
    <g filter="url(#dropWin)">
      <rect x="160" y="250" width="704" height="634" rx="124" fill="url(#win)"/>
    </g>
    <g clip-path="url(#frontClip)">
      <rect x="160" y="250" width="704" height="634" fill="url(#screenGlow)"/>
      <!-- Title bar -->
      <rect x="160" y="250" width="704" height="110" fill="#FFFFFF" fill-opacity="0.035"/>
      <line x1="160" y1="360" x2="864" y2="360" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="4"/>
      <!-- Faint scrollback above the prompt -->
      <g fill="#FFFFFF" fill-opacity="0.09">
        <rect x="262" y="408" width="210" height="22" rx="11"/>
        <rect x="490" y="408" width="120" height="22" rx="11"/>
      </g>
    </g>
    <rect x="162.5" y="252.5" width="699" height="629" rx="121.5" stroke="url(#winRim)" stroke-width="5"/>

    <!-- Window controls -->
    <circle cx="256" cy="305" r="17" fill="#FF5F57"/>
    <circle cx="312" cy="305" r="17" fill="#FEBC2E"/>
    <circle cx="368" cy="305" r="17" fill="#28C840"/>

    <!-- Prompt -->
    <path d="M276 488 L420 584 L276 680" stroke="url(#chevron)" stroke-width="60" stroke-linecap="round" stroke-linejoin="round" filter="url(#chevGlow)"/>
    <rect x="486" y="634" width="246" height="58" rx="29" fill="url(#cursor)" filter="url(#neon)"/>
  </g>

  <!-- Tile rim -->
  <rect x="101.5" y="101.5" width="821" height="821" rx="188.5" stroke="url(#tileRim)" stroke-width="3"/>
</svg>
