name: Release

# Push a tag like v0.1.2 to build every platform and publish a GitHub release:
#   Windows x64 + arm64: Inno Setup installer and portable exe
#   macOS x64 (Intel) + arm64 (Apple Silicon), macOS 12 Monterey or newer: .dmg and .zip, ad-hoc signed
# Run it by hand (workflow_dispatch) to build everything as artifacts without releasing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  WAILS_VERSION: v2.13.0
  GO_VERSION: '1.26.x' # Wails v2.13 binding generation breaks on Go 1.27
  NODE_VERSION: '24'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      numeric: ${{ steps.v.outputs.numeric }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v=$(jq -r .info.productVersion wails.json); fi
          num="${v%%-*}"
          pre=false; [ "$v" != "$num" ] && pre=true
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "numeric=$num" >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
          echo "Version $v (numeric $num, prerelease $pre)"

  windows:
    needs: version
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            arch: x64
          - goarch: arm64
            arch: arm64
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The tag is the source of truth: stamp it into wails.json so the exe's
      # version resource matches the installer.
      - name: Stamp version
        run: node -e "const f='wails.json',j=require('./'+f);j.info.productVersion=process.env.VERSION;require('fs').writeFileSync(f,JSON.stringify(j,null,2))"

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build app
        run: wails build -clean -platform windows/${{ matrix.goarch }} -trimpath -ldflags "-s -w"

      - name: Check exe architecture
        shell: pwsh
        run: |
          $b = [IO.File]::ReadAllBytes("build\bin\terminyxx.exe")
          $pe = [BitConverter]::ToInt32($b, 0x3c)
          $m = '{0:x4}' -f [BitConverter]::ToUInt16($b, $pe + 4)
          $want = @{ amd64 = '8664'; arm64 = 'aa64' }['${{ matrix.goarch }}']
          Write-Host "PE machine 0x$m"
          if ($m -ne $want) { throw "expected 0x$want" }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Build installer
        shell: pwsh
        run: |
          & $env:ISCC "/DAppVersion=$env:VERSION" "/DAppNumVersion=${{ needs.version.outputs.numeric }}" "/DArch=${{ matrix.arch }}" build\windows\installer\terminyxx.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "build\bin\Terminyxx-$env:VERSION-windows-${{ matrix.arch }}-setup.exe" dist\
          Copy-Item build\bin\terminyxx.exe "dist\Terminyxx-$env:VERSION-windows-${{ matrix.arch }}-portable.exe"
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: terminyxx-${{ env.VERSION }}-windows-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            arch: x64
            lipo: x86_64
          - goarch: arm64
            arch: arm64
            lipo: arm64
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Minimum supported macOS: 12 Monterey (also set as LSMinimumSystemVersion in Info.plist).
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      CGO_CFLAGS: -mmacosx-version-min=12.0
      CGO_LDFLAGS: -mmacosx-version-min=12.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Stamp version
        run: node -e "const f='wails.json',j=require('./'+f);j.info.productVersion=process.env.VERSION;require('fs').writeFileSync(f,JSON.stringify(j,null,2))"

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      # The runner is Apple Silicon; the Intel build is cross-compiled with clang.
      - name: Build app
        run: wails build -clean -platform darwin/${{ matrix.goarch }} -trimpath -ldflags "-s -w"

      - name: Bundle, check and sign
        run: |
          src=$(ls -d build/bin/*.app | head -1)
          [ "$src" = build/bin/Terminyxx.app ] || mv "$src" build/bin/Terminyxx.app
          app=build/bin/Terminyxx.app
          exe="$app/Contents/MacOS/$(defaults read "$PWD/$app/Contents/Info" CFBundleExecutable)"
          archs=$(lipo -archs "$exe"); echo "Architectures: $archs"
          [ "$archs" = "${{ matrix.lipo }}" ] || { echo "expected ${{ matrix.lipo }}"; exit 1; }
          minos=$(otool -l "$exe" | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print $2; exit}'); echo "minos: $minos"
          [ "${minos%%.*}" -le 12 ] || { echo "minimum macOS is above 12"; exit 1; }
          # Not notarized: an ad-hoc signature is the minimum Apple Silicon needs to run it.
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Package dmg and zip
        run: |
          mkdir -p dist dmg
          cp -R build/bin/Terminyxx.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Terminyxx" -srcfolder dmg -ov -format UDZO "dist/Terminyxx-$VERSION-macos-${{ matrix.arch }}.dmg"
          ditto -c -k --keepParent build/bin/Terminyxx.app "dist/Terminyxx-$VERSION-macos-${{ matrix.arch }}.zip"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: terminyxx-${{ env.VERSION }}-macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [version, windows, macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/release-notes
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * | tee SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          cat > notes.md <<EOF
          # Terminyxx $VERSION

          > SSH terminal, SFTP file manager and RDP launcher for Windows and macOS.

          ## Downloads

          | Platform | Installer | Portable |
          |:--|:--|:--|
          | 🪟 **Windows** x64 | [Terminyxx-$VERSION-windows-x64-setup.exe]($base/Terminyxx-$VERSION-windows-x64-setup.exe) | [portable .exe]($base/Terminyxx-$VERSION-windows-x64-portable.exe) |
          | 🪟 **Windows** ARM64 | [Terminyxx-$VERSION-windows-arm64-setup.exe]($base/Terminyxx-$VERSION-windows-arm64-setup.exe) | [portable .exe]($base/Terminyxx-$VERSION-windows-arm64-portable.exe) |
          | 🍎 **macOS** Intel (12+) | [Terminyxx-$VERSION-macos-x64.dmg]($base/Terminyxx-$VERSION-macos-x64.dmg) | [.zip]($base/Terminyxx-$VERSION-macos-x64.zip) |
          | 🍎 **macOS** Apple Silicon (12+) | [Terminyxx-$VERSION-macos-arm64.dmg]($base/Terminyxx-$VERSION-macos-arm64.dmg) | [.zip]($base/Terminyxx-$VERSION-macos-arm64.zip) |

          Verify downloads with [\`SHA256SUMS.txt\`]($base/SHA256SUMS.txt).

          <details>
          <summary>macOS: "app is damaged" or can't be opened</summary>

          The app is not notarized. Run this once after moving it to Applications:

          \`\`\`bash
          xattr -dr com.apple.quarantine /Applications/Terminyxx.app
          \`\`\`

          </details>

          Already installed? Terminyxx checks GitHub for new releases at startup (Settings → About).

          ---

          EOF
          sed -i 's/^          //' notes.md
          # Hand-written highlights for this version, if the repo has them.
          [ -f ".github/release-notes/$GITHUB_REF_NAME.md" ] && { cat ".github/release-notes/$GITHUB_REF_NAME.md"; echo; } >> notes.md
          flags=(--title "Terminyxx $VERSION" --notes-file notes.md --generate-notes)
          [ "${{ needs.version.outputs.prerelease }}" = true ] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* "${flags[@]}"
